name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    name: Analyse de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Typecheck, tests, migrations, build
    runs-on: ubuntu-latest
    # Base Postgres jetable propre à la CI — jamais les identifiants Railway
    # de production. Les migrations doivent s'appliquer proprement sur une
    # base neuve à chaque PR ; c'est le test qui détecte une migration oubliée
    # ou en conflit avant que ça n'atteigne la production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jedco_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jedco_ci
      SESSION_SECRET: ci-secret-jamais-utilise-en-production-32-car
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Applique les migrations sur une base neuve
        run: npx prisma migrate deploy

      - name: Génère le client Prisma
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
